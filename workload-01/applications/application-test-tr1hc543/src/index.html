<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Red Button</title>
    <style>
      :root {
        --bg: #f2f2ef;
        --ink: #1e2224;
        --muted: #61686b;
        --red: #d7261e;
        --red-dark: #9e1610;
        --ring: #c9ccc8;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #171a1b;
          --ink: #e6e8e6;
          --muted: #99a1a3;
          --ring: #2c3133;
        }
      }
      *,
      *::before,
      *::after {
        box-sizing: inherit;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        background: var(--bg);
        color: var(--ink);
        font:
          16px/1.4 system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
        display: grid;
        place-items: center;
        text-align: center;
      }
      main {
        display: grid;
        justify-items: center;
        gap: 36px;
        padding: 24px;
      }
      .housing {
        width: min(70vw, 280px);
        aspect-ratio: 1;
        border-radius: 50%;
        background: var(--ring);
        display: grid;
        place-items: center;
        box-shadow: inset 0 4px 10px rgba(0, 0, 0, 0.18);
      }
      .button {
        width: 82%;
        aspect-ratio: 1;
        border-radius: 50%;
        border: 0;
        cursor: pointer;
        background: radial-gradient(
          circle at 35% 30%,
          #ff5a4f 0%,
          var(--red) 45%,
          var(--red-dark) 100%
        );
        box-shadow:
          0 10px 0 var(--red-dark),
          0 16px 24px rgba(0, 0, 0, 0.3);
        transform: translateY(-6px);
        transition:
          transform 80ms ease,
          box-shadow 80ms ease;
        color: #fff;
        font:
          700 1.3rem/1 system-ui,
          sans-serif;
        letter-spacing: 0.02em;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.35);
      }
      .button:active,
      .button.pressed {
        transform: translateY(4px);
        box-shadow:
          0 0 0 var(--red-dark),
          0 4px 8px rgba(0, 0, 0, 0.3);
      }
      .button:focus-visible {
        outline: 4px solid var(--ink);
        outline-offset: 6px;
      }
      .result {
        min-height: 2.5em;
        margin: 0;
        font-size: 1.6rem;
        font-weight: 700;
      }
      .result small {
        display: block;
        font-size: 0.9rem;
        font-weight: 400;
        color: var(--muted);
        margin-top: 6px;
      }
      @media (prefers-reduced-motion: reduce) {
        .button {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="housing">
        <button class="button" id="btn" type="button">Press</button>
      </div>
      <p class="result" id="result" role="status" aria-live="polite"></p>
    </main>
    <script>
      const btn = document.getElementById('btn')
      const result = document.getElementById('result')
      let count = 0
      btn.addEventListener('click', () => {
        count += 1
        btn.classList.add('pressed')
        setTimeout(() => btn.classList.remove('pressed'), 120)
        result.innerHTML =
          'It works! <small>Pressed ' +
          count +
          (count === 1 ? ' time' : ' times') +
          '</small>'
      })
    </script>
  </body>
</html>
