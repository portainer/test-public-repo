    portainer-run/git-path: workload-01/applications/application-test-7ehjp7hl.yaml
    portainer-run/runtime: nginx
    kubernetes.io/ingress.class: traefik
spec:
  ingressClassName: traefik
  rules:
    - host: application-test-7ehjp7hl.c55fcad8a5ba-02.internal.portainercloud.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: application-test-7ehjp7hl
                port:
                  number: 8080
